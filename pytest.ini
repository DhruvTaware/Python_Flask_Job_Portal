[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    unit: Unit tests for models and form validation
    integration: Integration tests for HTTP endpoints and workflows
    e2e: End-to-end browser automation tests using Selenium
    regression: Regression test suite
    smoke: Quick sanity smoke tests
